<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fact Checker Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="wordmark">
      <img class="logo-mark" src="cat.svg" alt="" width="36" height="36" />
      <span class="wordmark-text">Fact Checker Demo</span>
    </div>
    <button id="start-button">Start</button>
  </header>

  <main>
    <section class="panel">
      <h2>Transcript</h2>
      <p id="transcript">(nothing yet - click Start and speak into your microphone)</p>
    </section>

    <section class="panel">
      <h2>Results</h2>
      <div id="results"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
