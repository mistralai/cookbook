[alembic]
script_location = src/db/migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os

# A generated revision has to pass the app's lint and format checks as written: `ruff check --fix`
# sorts the template's imports and drops any a revision leaves unused, then `ruff format` lays it
# out. The hook uses only the ruff in the app's environment, which `uv run` names in VIRTUAL_ENV,
# and does nothing when the app does not install one.
[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = sh
ruff.options = -c 'ruff="$VIRTUAL_ENV/bin/ruff"; [ -n "$VIRTUAL_ENV" ] && [ -x "$ruff" ] || exit 0; "$ruff" check --fix "$0" && "$ruff" format "$0"' REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
