[project]
name = "utils"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "structlog>=25.5.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "env",
    "mistralai>=3.6.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
env = { workspace = true }
